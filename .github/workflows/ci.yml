name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namzy-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uvx ruff check .
      - name: Format check
        run: uvx ruff format --check .
      - name: Type check
        run: uvx mypy src/namzy
      - name: Test
        run: uvx hatch test

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namzy-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namzy-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test && cargo test --doc

  cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: namzy-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt5
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev cmake
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Smoke run
        run: ./build/namzy --count 5 --seed 1
