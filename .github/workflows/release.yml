name: Release

# Publishes every package to its registry when a vX.Y.Z tag is pushed.
# Each publish step runs only when its registry token is configured, so the
# workflow never fails on a repo that has not wired up a given secret.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt5
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev cmake

      - name: Sync package versions to the tag
        run: python3 scripts/sync_version.py "${GITHUB_REF_NAME}"

      - name: Build all packages
        env:
          NAMZY_VERSION: ${{ github.ref_name }}
        run: NAMZY_VERSION="${GITHUB_REF_NAME}" ./build.sh

      - name: Publish namzy-py → PyPI
        if: ${{ env.UV_PUBLISH_TOKEN != '' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        working-directory: namzy-py
        run: uv publish

      - name: Publish namzy-ts → npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: namzy-ts
        run: npm publish --access public

      - name: Publish namzy-rs → crates.io
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        working-directory: namzy-rs
        run: cargo publish --allow-dirty

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            namzy-py/dist/*
            namzy-cpp/build/namzy
