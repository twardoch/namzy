<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>namzy — fun fused project names</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
    max-width: 36rem; margin: 4rem auto; padding: 0 1rem;
  }
  h1 { font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  p.lede { color: #666; margin: 0 0 2rem; }
  fieldset {
    border: 1px solid #ccc4; border-radius: 8px;
    padding: 1rem 1.25rem; margin: 0 0 1.25rem;
  }
  legend { padding: 0 .35rem; color: #888; }
  label { display: block; margin: .5rem 0; }
  input[type=number] { width: 5rem; }
  button {
    font: inherit; padding: .6rem 1.2rem; border: 0; border-radius: 6px;
    background: #2057ff; color: #fff; cursor: pointer;
  }
  button:hover { background: #1742c0; }
  ul.names {
    list-style: none; padding: 0; margin: 1rem 0 0;
    font: 1.4rem/1.4 ui-monospace, Menlo, monospace;
  }
  ul.names li { padding: .25rem 0; }
  .hint { color: #888; font-size: .85em; }
  code { background: #8881; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>namzy</h1>
  <p class="lede">Fun, fused, mangled project names. Two words spliced together at a clean junction, then run through a consonant rotation.</p>

  <fieldset>
    <legend>Options</legend>
    <label>
      Count: <input type="number" id="count" min="1" max="50" value="6">
    </label>
    <label>
      <input type="checkbox" id="online">
      Online mode (fetches random words; may fail due to CORS)
    </label>
    <button id="go">Generate</button>
  </fieldset>

  <ul class="names" id="out"></ul>

  <p class="hint">Mangling: <code>c→q · f→v · k→c · q→k · s→z · z→s · v→f · w→u</code>. Junction cleanup drops a duplicate letter or a vowel-on-vowel clash at the seam.</p>

  <script src="./namzy.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const out = $("out");
    const btn = $("go");

    async function run() {
      out.innerHTML = "";
      const count = Math.max(1, Math.min(50, parseInt($("count").value, 10) || 1));
      const online = $("online").checked;
      const base = Date.now();
      btn.disabled = true;
      try {
        for (let i = 0; i < count; i++) {
          const name = await namzy.generate({ online, seed: base + i * 1337 });
          const li = document.createElement("li");
          li.textContent = name;
          out.appendChild(li);
        }
      } catch (e) {
        const li = document.createElement("li");
        li.textContent = "Error: " + e.message;
        out.appendChild(li);
      } finally {
        btn.disabled = false;
      }
    }
    btn.addEventListener("click", run);
    run();
  </script>
</body>
</html>
